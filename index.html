<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Receipt portal</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <h1>Receipts</h1>
        <p class="lede">Your payments and their receipts.</p>
        <button id="sign-out" class="ghost" hidden>Sign out</button>
      </header>

      <section id="sign-in" hidden aria-labelledby="sign-in-heading">
        <h2 id="sign-in-heading">Sign in</h2>
        <p class="lede">
          Enter your email and we will send a one-time link. There is no password to
          remember or to leak.
        </p>
        <form id="sign-in-form" novalidate>
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" required />
          <button type="submit">Email me a link</button>
        </form>
      </section>

      <section id="payments" hidden aria-labelledby="payments-heading" aria-busy="true">
        <h2 id="payments-heading" class="visually-hidden">Your payments</h2>
        <div class="table-scroll" tabindex="0" role="region" aria-labelledby="payments-caption">
          <table>
            <caption id="payments-caption" class="visually-hidden">Your payments, most recent first</caption>
            <thead>
              <tr>
                <th scope="col">Date</th>
                <th scope="col">Description</th>
                <th scope="col" class="numeric">Amount</th>
                <th scope="col">Status</th>
                <th scope="col">Receipt</th>
              </tr>
            </thead>
            <tbody id="payments-body"></tbody>
          </table>
        </div>
        <p id="payments-empty" class="notice" hidden>No payments yet.</p>
      </section>

      <p id="status" class="notice" role="status" aria-live="polite" hidden></p>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
